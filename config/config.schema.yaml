    description: Optional two-letter country code from data/countries.json. Exotic entries show its flag at the bottom-left, behind the bird. Omit or leave empty for no flag.

  group:
    type: object
    required: [type, title, items]
    properties:
      type: { const: group }
      title: { type: string }
      tag: { type: string }
      bg: { type: string }
      favorite: { type: boolean }
      exotic: { type: boolean }
      icon: { type: string }
      rotation: { $ref: "#/$defs/rotation" }
      country: { $ref: "#/$defs/country" }
      items:
        type: array
        items: { $ref: "#/$defs/item" }
    additionalProperties: false

  bird:
    type: object
    required: [type, title]
    properties:
      type: { const: bird }
      title: { type: string }
      scientific_name:
        type: string
        maxLength: 200
        description: Optional scientific name, displayed in smaller italics beneath the common name on a dedicated detail-page key.
      favorite: { type: boolean }
      exotic: { type: boolean }
      icon: { type: string }
      rotation: { $ref: "#/$defs/rotation" }
      country: { $ref: "#/$defs/country" }
      nabu:
        type: string
        pattern: '^$|^https://www\.nabu\.de/tiere-und-pflanzen/voegel/portraets/[A-Za-z0-9-]+/$'
        description: Optional NABU bird portrait URL; adds a NABU website action beside eBird on the detail page.
    additionalProperties: false

  uncertain:
    type: object
    required: [type]
    properties:
      type: { const: uncertain }
    additionalProperties: false
