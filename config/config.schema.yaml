# config.schema.yaml
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Bird Tagging Profile Wrapper
type: object
required: [profile]
properties:
  profile:
    $ref: "#/$defs/profile"

$defs:
  profile:
    type: object
    required: [name, lightroom, model, size, items]
    properties:
      name:
        type: string
      lightroom:
        type: string
      model:
        type: string
      image_size:
        type: integer
        minimum: 16
        maximum: 1024
        default: 72
        description: Square key image size in pixels; rendered at 288 pixels or higher before downscaling.
      size:
        type: object
        required: [columns, rows]
        properties:
          columns: { type: integer, minimum: 1 }
          rows: { type: integer, minimum: 1 }
      items:
        type: array
        items:
          $ref: "#/$defs/item"

  item:
    oneOf:
      - $ref: "#/$defs/group"
      - $ref: "#/$defs/bird"
      - $ref: "#/$defs/uncertain"

  rotation:
    type: number
    minimum: -180
    maximum: 180
    default: 0
    description: Bird image rotation in degrees; positive rotates clockwise. Backgrounds, flags, and text remain upright.

